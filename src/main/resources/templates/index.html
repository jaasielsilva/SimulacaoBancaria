<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments :: head}"></head>
<body>

<div th:replace="~{fragments :: navbar(${saldo})}"></div>

<div class="container mt-4">

    <h1 class="text-center mb-4">Simulação Bancária</h1>

    <!-- Mensagem dinâmica -->
    <div th:if="${mensagem}" class="alert" th:classappend="' alert-' + ${alertType}" role="alert" th:text="${mensagem}"></div>

    <div class="row g-4 justify-content-center">

        <!-- Card Depositar -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Depositar</h5>
                    <form action="/depositar" method="post" class="d-flex flex-column">
                        <input type="number" step="0.01" name="valor" class="form-control mb-3" placeholder="Valor" required />
                        <button type="submit" class="btn btn-success">Depositar</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Card Sacar -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Sacar</h5>
                    <form action="/sacar" method="post" class="d-flex flex-column">
                        <input type="number" step="0.01" name="valor" class="form-control mb-3" placeholder="Valor" required />
                        <button type="submit" class="btn btn-danger">Sacar</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Card Saldo Atual -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body d-flex flex-column justify-content-between">
                    <h5 class="card-title">Saldo Atual</h5>
                    <p class="fs-3" th:text="${saldo}">R$ 0,00</p>
                    <form action="/" method="get">
                        <button type="submit" class="btn btn-primary mt-auto">Atualizar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Histórico -->
    <div class="mt-5">
        <h3 class="text-center">Histórico de Transações</h3>

        <!-- Container com rolagem fixa -->
        <div style="
            max-height: 300px;
            overflow-y: auto;
            overflow-x: hidden;
            border: 1px solid #dee2e6;
            border-radius: 5px;
        ">
            <table class="table table-striped m-0" style="table-layout: fixed; width: 100%; border-collapse: separate;">
                <thead class="table-dark">
                    <tr>
                        <th style="position: sticky; top: 0; background-color: #212529; z-index: 1;">Tipo</th>
                        <th style="position: sticky; top: 0; background-color: #212529; z-index: 1;">Valor</th>
                        <th style="position: sticky; top: 0; background-color: #212529; z-index: 1;">Data e Hora</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="transacao : ${historico}">
                        <td th:text="${transacao.tipo}">Tipo</td>
                        <td th:text="${#numbers.formatDecimal(transacao.valor, 1, 2)}">0.00</td>
                        <td th:text="${#temporals.format(transacao.dataHora, 'dd/MM/yyyy HH:mm:ss')}">Data</td>
                    </tr>
                    <tr th:if="${historico.isEmpty()}">
                        <td colspan="3" class="text-center">Nenhuma transação registrada.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
